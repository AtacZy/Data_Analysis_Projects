services:

  # ─────────────────────────────────────────────────────
  # 1. PostgreSQL: БД с named volume
  # ─────────────────────────────────────────────────────
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: ataczy/compose-project-postgres:1.0
    container_name: cp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ─────────────────────────────────────────────────────
  # 2. Python API (Flask)
  # ─────────────────────────────────────────────────────
  python-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    image: ataczy/compose-project-python-api:1.0
    container_name: cp-python-api
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  # ─────────────────────────────────────────────────────
  # 3. Nginx: фронт + reverse proxy
  # ─────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ataczy/compose-project-nginx:1.0
    container_name: cp-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - python-api
    networks:
      - app-net

# ─────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
